name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#b45cff
            dist/github-snake.gif?color_snake=#b45cff
            - name: Save Snake
              uses: EndBug/add-and-commit@v9
                with:
                message: "chore: update contribution snake"
                  add: "dist"
